# ZKCommerce Nginx Config
# Place at /etc/nginx/sites-available/zkcommerce

upstream zkcommerce_api {
    server localhost:3000;
    keepalive 32;
}

# Main API
server {
    listen 443 ssl http2;
    server_name api.zkcommerce.in;

    ssl_certificate     /etc/letsencrypt/live/api.zkcommerce.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zkcommerce.in/privkey.pem;

    client_max_body_size 10M;
    gzip on; gzip_types application/json;

    location / {
        proxy_pass http://zkcommerce_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Razorpay webhook — no rate limit
    location /api/payments/webhook {
        proxy_pass http://zkcommerce_api;
        proxy_read_timeout 30s;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.zkcommerce.in *.zkcommerce.in;
    return 301 https://$host$request_uri;
}
