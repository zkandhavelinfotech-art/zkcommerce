<!DOCTYPE html>
<html lang="en">
<head>
<script src="../zk-env.js"></script>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1565C0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password — ZKCommerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href='../assets/css/design-system.css">
</head>
<body>
<style>body{min-height:100vh;background:var(--g-hero);display:flex;align-items:center;justify-content:center;padding:24px}</style>
<div style="background:#fff;border-radius:24px;padding:40px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.2)">
  <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:800;margin-bottom:28px;justify-content:center">
    <div style="width:40px;height:40px;border-radius:10px;background:var(--g-fire);display:flex;align-items:center;justify-content:center;font-size:20px">⚡</div>ZKCommerce
  </div>
  <div style="text-align:center;font-size:32px;margin-bottom:12px">🔑</div>
  <h2 style="font-family:var(--font-display);font-size:22px;font-weight:800;margin-bottom:6px;text-align:center">Reset password</h2>
  <p style="font-size:13px;color:var(--zk-muted);text-align:center;margin-bottom:24px">Enter your email and we'll send a reset link via WhatsApp and email.</p>
  <div id="alert-box"></div>
  <div class="field-group" style="margin-bottom:16px"><label class="field-label">Email address</label><input type="email" class="field" id="email" placeholder="merchant@example.in"></div>
  <button class="btn btn-primary btn-full" onclick="doReset()">Send reset link →</button>
  <div style="text-align:center;margin-top:16px"><a href="login.html" style="font-size:13px;font-weight:700;color:var(--zk-fire)">← Back to sign in</a></div>
</div>
<script>
async function doReset(){
  const email=document.getElementById('email').value.trim();
  const ab=document.getElementById('alert-box');
  if(!validate.email(email)){ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">Enter a valid email address.</div>';return;}
  ab.innerHTML='<div class="alert alert-success" style="margin-bottom:14px">✅ Reset link sent to '+email+'. Check your email and WhatsApp.</div>';
}
</script>
<script src="../assets/js/app.js"></script>
<script>
var API_BASE = ZK.api;

async function doForgotPassword() {
  var email = document.getElementById('email');
  if (!email || !email.value.trim()) { toast.error('Enter your email address'); return; }
  var btn = event.currentTarget;
  btnLoading(btn, true);
  try {
    var r = await fetch(API_BASE + '/auth/forgot-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email: email.value.trim() })
    });
    var d = await r.json();
    toast.success(d.message || 'Reset link sent! Check your email.');
    email.value = '';
  } catch(e) {
    toast.info('If that email exists, a reset link has been sent.');
  }
  btnLoading(btn, false);
}
</script>
</body>
</html>
