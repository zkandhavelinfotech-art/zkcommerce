<!doctype html>
<html lang="en"><head>
<script src="../zk-env.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13211c"><title>Choose your storefront · StoreBuilder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',sans-serif;color:#17211c;background:#f5f6f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1240px;margin:auto;padding:30px 28px 46px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:46px}.brand{font-size:17px;font-weight:700;letter-spacing:-.04em}.brand span{color:#528665}.step{font-size:12px;color:#647168}.intro{max-width:700px;margin:0 auto 30px;text-align:center}.eyebrow{font-size:11px;color:#528665;font-weight:700;text-transform:uppercase;letter-spacing:.13em}.intro h1{font:600 clamp(32px,5vw,48px) 'Playfair Display',serif;letter-spacing:-.03em;margin:10px 0}.intro p{color:#68736b;font-size:15px;line-height:1.6;margin:0}.store-name{max-width:460px;margin:0 auto 26px}.store-name label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.store-name input{width:100%;height:45px;border:1px solid #d8ded8;border-radius:9px;padding:0 13px;font:14px inherit;background:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{overflow:hidden;background:white;border:1px solid #e0e5df;border-radius:13px;transition:.18s;cursor:pointer}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px #24372a14}.card.selected{border:2px solid #318255;box-shadow:0 0 0 3px #31825520}.preview{height:224px;background:#eee;position:relative;overflow:hidden}.preview iframe{width:1440px;height:1000px;border:0;transform:scale(.3);transform-origin:top left;pointer-events:none}.preview.generic{display:grid;place-items:center;padding:20px}.mini{width:100%;height:100%;border-radius:8px;padding:13px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.mini-top{height:15px;border-radius:3px;background:#ffffffb9;display:flex;justify-content:space-between;align-items:center;padding:0 6px}.mini-hero{height:85px;border-radius:5px;padding:12px}.mini-hero b{display:block;width:58%;height:10px;border-radius:4px;background:#fff9}.mini-hero i{display:block;width:39%;height:6px;border-radius:4px;background:#fff8;margin-top:8px}.mini-products{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:1}.mini-products i{border-radius:5px;background:#f5f3ef;border:1px solid #eee}.card-main{padding:15px 16px 16px}.card-heading{display:flex;align-items:center;justify-content:space-between;gap:9px}.card h2{font-size:15px;margin:0}.badge{font-size:10px;color:#637067;background:#f1f4f0;border-radius:20px;padding:5px 8px;white-space:nowrap}.card p{font-size:12px;line-height:1.5;color:#68736b;min-height:36px;margin:8px 0 12px}.swatches{display:flex;gap:5px}.swatches i{height:17px;width:17px;border:1px solid #0001;border-radius:50%}.choose{display:block;margin-top:14px;width:100%;border:1px solid #e0e5df;background:#fff;border-radius:7px;padding:9px;color:#27332b;font:600 12px inherit;cursor:pointer}.selected .choose{background:#318255;color:white;border-color:#318255}.bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:26px auto 0;max-width:740px}.note{font-size:12px;color:#69756d}.continue{height:46px;padding:0 25px;border:0;border-radius:8px;background:#203d2c;color:white;font:700 13px inherit;cursor:pointer}.continue:disabled{opacity:.42;cursor:not-allowed}.error{max-width:740px;margin:12px auto 0;color:#ae302c;font-size:13px;text-align:right;min-height:20px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:22px 18px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.preview{height:200px}.top{margin-bottom:30px}.bottom{align-items:stretch;flex-direction:column}.continue{width:100%}.error{text-align:center}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span>Store</span>Builder</div><div class="step">Step 1 of 3 · Choose a design</div></header><section class="intro"><div class="eyebrow">Your store starts here</div><h1>Choose a look for your brand</h1><p>Pick a starting design. You can change the name, colors, photos, products and every section in Store Builder.</p></section><div class="store-name"><label for="storeName">Store name</label><input id="storeName" maxlength="150" autocomplete="organization" placeholder="Your brand name"></div><section id="templateGrid" class="grid" aria-label="Storefront templates"></section><div class="bottom"><div class="note">Your choice creates a private, editable copy for your store.</div><button id="continue" class="continue" disabled>Use this design →</button></div><div id="error" class="error" role="status"></div></main>
<script>
const apiRoot=ZK.api;
const token=localStorage.getItem('zk_token');let templates=[],selected=null;
const grid=document.getElementById('templateGrid'),button=document.getElementById('continue'),nameInput=document.getElementById('storeName');
try{const u=JSON.parse(localStorage.getItem('zk_user')||'{}');nameInput.value=localStorage.getItem('zk_pending_store_name')||u.store_name||''}catch(_){}
function esc(s){const e=document.createElement('span');e.textContent=s||'';return e.innerHTML}
function card(t){const el=document.createElement('article');el.className='card';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-pressed','false');let preview;if(t.preview){preview=`<div class="preview"><iframe title="${esc(t.name)} storefront preview" src="${esc(t.preview.startsWith('/api/')?apiRoot.replace(/\/api$/,'')+t.preview:t.preview)}" loading="lazy" tabindex="-1" sandbox=""></iframe></div>`}else{const c=t.colors;preview=`<div class="preview generic"><div class="mini" style="background:${c[1]}"><div class="mini-top" style="color:${c[0]}"><b>${esc(t.name)}</b><i>☰　♡　🛒</i></div><div class="mini-hero" style="background:linear-gradient(120deg,${c[0]},${c[2]})"><b></b><i></i></div><div class="mini-products"><i></i><i></i><i></i></div></div></div>`}el.innerHTML=`${preview}<div class="card-main"><div class="card-heading"><h2>${esc(t.name)}</h2><span class="badge">${esc(t.category)}</span></div><p>${esc(t.description)}</p><div class="swatches">${t.colors.map(c=>`<i style="background:${esc(c)}"></i>`).join('')}</div><button class="choose" type="button">Choose design</button></div>`;el.addEventListener('click',()=>select(t,el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(t,el)}});return el}
function select(t,el){selected=t;grid.querySelectorAll('.card').forEach(x=>{const on=x===el;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on));x.querySelector('.choose').textContent=on?'Selected ✓':'Choose design'});button.disabled=false;document.getElementById('error').textContent=''}
async function load(){if(!token){location.href='../auth/login.html';return}try{const r=await fetch(apiRoot+'/stores/templates');const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load storefront designs');templates=d.templates||[];templates.forEach(t=>grid.appendChild(card(t)));}catch(e){document.getElementById('error').textContent=e.message}}
button.addEventListener('click',async()=>{const store_name=nameInput.value.trim();if(!store_name){nameInput.focus();document.getElementById('error').textContent='Add a store name to continue.';return}if(!selected)return;button.disabled=true;button.textContent='Creating your store…';try{const r=await fetch(apiRoot+'/stores/setup',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({template_id:selected.id,store_name})});const d=await r.json();if(!r.ok){if(r.status===409&&d.store_id){location.href='./';return}throw Error(d.error||'Could not create your store')}localStorage.removeItem('zk_pending_store_name');const user=JSON.parse(localStorage.getItem('zk_user')||'{}');user.store_id=d.store.id;localStorage.setItem('zk_user',JSON.stringify(user));location.href='./'}catch(e){document.getElementById('error').textContent=e.message;button.disabled=false;button.textContent='Use this design →'}});
load();
</script></body></html>
