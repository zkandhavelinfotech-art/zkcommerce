<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform Admin · ZKCommerce</title>
<style>
:root{color-scheme:dark;--bg:#080e18;--panel:#101a28;--panel2:#142236;--line:#24354b;--text:#edf4fc;--muted:#91a4b9;--blue:#39a7ff;--green:#5cd69b;--amber:#f6c35b;--red:#ff7b86}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#143454 0%,transparent 65%),var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1240px)/2));background:rgba(8,14,24,.85);position:sticky;top:0;z-index:2;backdrop-filter:blur(16px)}
.brand{font-size:18px;font-weight:800;letter-spacing:-.4px}.brand b{color:var(--blue)}.admin-tag{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-left:10px;border:1px solid var(--line);border-radius:99px;padding:5px 8px}
.right{display:flex;gap:14px;align-items:center;color:var(--muted)}button,select{font:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);background:#132238;color:var(--text);padding:9px 13px;border-radius:9px;font-weight:650}.btn:hover{border-color:var(--blue)}.btn-primary{background:var(--blue);border-color:var(--blue);color:#071321}
main{max-width:1240px;margin:0 auto;padding:40px 24px 72px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:8px 0 28px}.heading h1{font-size:32px;letter-spacing:-1px;margin:0 0 8px}.heading p{color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.card,.panel{background:linear-gradient(145deg,rgba(20,34,54,.92),rgba(13,23,37,.96));border:1px solid var(--line);border-radius:15px}.card{padding:18px 20px}.card span{font-size:12px;color:var(--muted)}.card strong{display:block;font-size:30px;letter-spacing:-1px;margin-top:9px}.card strong.blue{color:var(--blue)}.card strong.green{color:var(--green)}.card strong.amber{color:var(--amber)}
.panel{overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.panel-head h2{font-size:16px;margin:0}.tools{display:flex;gap:9px}.tools select{background:#0b1421;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;padding:13px 18px;background:rgba(6,13,22,.35)}td{padding:15px 18px;border-top:1px solid rgba(36,53,75,.72);vertical-align:middle}tbody tr:hover{background:rgba(57,167,255,.035)}.store-name{font-weight:750}.store-sub{display:block;color:var(--muted);font-size:12px;margin-top:4px}.status{display:inline-flex;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750;text-transform:capitalize}.status-draft{color:var(--amber);background:#f6c35b16}.status-published,.status-live{color:var(--green);background:#5cd69b16}.status-suspended{color:var(--red);background:#ff7b8616}.muted{color:var(--muted)}.row-actions{display:flex;gap:7px}.small{font-size:12px;padding:7px 10px}.empty,.loading{padding:44px;text-align:center;color:var(--muted)}.error{color:var(--red);padding:16px 20px}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--line);color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:#02070dcc;z-index:5;padding:3vh 3vw}.overlay.open{display:flex}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(1280px,100%);height:94vh;margin:auto;display:flex;flex-direction:column;overflow:hidden}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 18px;border-bottom:1px solid var(--line)}.dialog-title{font-weight:750}.dialog-controls{display:flex;gap:8px;align-items:center}.dialog-controls select{background:#0b1421;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.preview-frame{border:0;background:#fff;flex:1;width:100%}
@media(max-width:760px){header{padding:0 16px}.right .who{display:none}main{padding:28px 14px}.heading{align-items:start;flex-direction:column}.heading h1{font-size:27px}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:15px}.card strong{font-size:26px}.panel-head{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools select{flex:1}.overlay{padding:0}.dialog{height:100vh;border-radius:0}}
</style>
</head>
<body>
<header><div><span class="brand"><b>ZK</b>Commerce</span><span class="admin-tag">PLATFORM ADMIN</span></div><div class="right"><span class="who" id="adminName">Admin</span><button class="btn" onclick="logout()">Sign out</button></div></header>
<main>
<div class="eyebrow">Platform overview</div>
<div class="heading"><div><h1>Store operations</h1><p>Review newly created stores and inspect their storefront previews.</p></div><button class="btn btn-primary" onclick="loadStores()">↻ Refresh</button></div>
<section class="cards" aria-label="Store totals"><div class="card"><span>Total stores</span><strong class="blue" id="totalCount">—</strong></div><div class="card"><span>Draft</span><strong class="amber" id="draftCount">—</strong></div><div class="card"><span>Published</span><strong class="green" id="publishedCount">—</strong></div><div class="card"><span>Live</span><strong id="liveCount">—</strong></div></section>
<section class="panel"><div class="panel-head"><h2>Recent stores</h2><div class="tools"><select id="statusFilter" onchange="loadStores()"><option value="">All statuses</option><option value="draft">Draft</option><option value="published">Published</option><option value="live">Live</option><option value="suspended">Suspended</option></select><select id="pageSize" onchange="loadStores()"><option value="20">20 per page</option><option value="50">50 per page</option><option value="100">100 per page</option></select></div></div>
<div id="tableContent" class="loading">Loading stores…</div><div class="pagination"><span id="pageLabel">Page 1</span><div><button class="btn small" id="prevPage" onclick="changePage(-1)">Previous</button> <button class="btn small" id="nextPage" onclick="changePage(1)">Next</button></div></div></section>
</main>
<div class="overlay" id="previewOverlay" onclick="if(event.target===this)closePreview()"><div class="dialog"><div class="dialog-head"><span class="dialog-title" id="previewTitle">Store preview</span><div class="dialog-controls"><select id="previewVersion" onchange="reloadPreview()"><option value="draft">Draft</option><option value="published">Published</option></select><button class="btn small" onclick="closePreview()">Close</button></div></div><iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-forms" title="Storefront preview"></iframe></div></div>
<script>
const API='/api';let page=1,previewId=null,token=localStorage.getItem('zk_token')||'';let user={};try{user=JSON.parse(localStorage.getItem('zk_user')||'{}')}catch{}
if(!token){location.href='../auth/login.html';}else if(user.role!=='admin'){location.href='../store-builder/';}
document.getElementById('adminName').textContent=user.name||user.email||'Admin';
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{Authorization:'Bearer '+token,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d;}
async function loadStores(){const status=document.getElementById('statusFilter').value,limit=document.getElementById('pageSize').value;const q=new URLSearchParams({page:String(page),limit});if(status)q.set('status',status);const box=document.getElementById('tableContent');box.className='loading';box.textContent='Loading stores…';try{const d=await api('/admin/stores?'+q.toString());document.getElementById('totalCount').textContent=d.summary.total;document.getElementById('draftCount').textContent=d.summary.draft;document.getElementById('publishedCount').textContent=d.summary.published;document.getElementById('liveCount').textContent=d.summary.live;document.getElementById('pageLabel').textContent='Page '+page;document.getElementById('prevPage').disabled=page<=1;document.getElementById('nextPage').disabled=d.stores.length<Number(limit);if(!d.stores.length){box.className='empty';box.textContent='No stores found for this filter.';return;}box.className='scroll';box.innerHTML='<table><thead><tr><th>Store</th><th>Owner</th><th>Status</th><th>Products</th><th>Orders</th><th>Created</th><th>Actions</th></tr></thead><tbody>'+d.stores.map(s=>`<tr><td><span class="store-name">${escapeHtml(s.store_name)}</span><span class="store-sub">${escapeHtml(s.slug)}${s.custom_domain?' · '+escapeHtml(s.custom_domain):''}</span></td><td>${escapeHtml(s.merchant_name||'—')}<span class="store-sub">${escapeHtml(s.merchant_email||'')}</span></td><td><span class="status status-${escapeHtml(s.status)}">${escapeHtml(s.status)}</span></td><td>${s.product_count}</td><td>${s.order_count}</td><td>${s.created_at?new Date(s.created_at).toLocaleDateString():''}</td><td><div class="row-actions"><button class="btn small" onclick="openPreview(${s.id},${escapeHtml(JSON.stringify(s.store_name))})">Preview</button></div></td></tr>`).join('')+'</tbody></table>';}catch(e){box.className='error';box.textContent=e.message;if(/token|admin/i.test(e.message)){localStorage.removeItem('zk_token');localStorage.removeItem('zk_user');}}}
function changePage(delta){page=Math.max(1,page+delta);loadStores();}
function openPreview(id,name){previewId=id;document.getElementById('previewTitle').textContent=name+' · Store preview';document.getElementById('previewVersion').value='draft';document.getElementById('previewOverlay').classList.add('open');reloadPreview();}
async function reloadPreview(){if(!previewId)return;const frame=document.getElementById('previewFrame');frame.srcdoc='<p style="font:14px Arial;padding:24px">Loading preview…</p>';try{const version=document.getElementById('previewVersion').value;const r=await fetch(`${API}/admin/stores/${previewId}/preview?version=${version}`,{headers:{Authorization:'Bearer '+token}});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Could not load preview');}frame.srcdoc=await r.text();}catch(e){frame.srcdoc='<p style="font:14px Arial;color:#a22;padding:24px">'+escapeHtml(e.message)+'</p>';}}
function closePreview(){document.getElementById('previewOverlay').classList.remove('open');document.getElementById('previewFrame').srcdoc='';previewId=null;}
function logout(){localStorage.removeItem('zk_token');localStorage.removeItem('zk_user');location.href='../auth/login.html';}
loadStores();
</script>
</body>
</html>
