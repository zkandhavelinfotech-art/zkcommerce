<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../../zk-env.js"></script>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1565C0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — ZKCommerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href='../assets/css/design-system.css">
</head>
<body>
<style>body{min-height:100vh;background:var(--g-hero);display:flex;align-items:center;justify-content:center;padding:24px}</style>
<div style="background:#fff;border-radius:24px;padding:40px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.2)">
  <div style="text-align:center;font-size:32px;margin-bottom:16px">🔒</div>
  <h2 style="font-family:var(--font-display);font-size:22px;font-weight:800;margin-bottom:6px;text-align:center">Set new password</h2>
  <p style="font-size:13px;color:var(--zk-muted);text-align:center;margin-bottom:24px">Choose a strong password for your account.</p>
  <div id="alert-box"></div>
  <div class="field-group" style="margin-bottom:12px"><label class="field-label">New password</label><input type="password" class="field" id="p1" placeholder="Min 8 characters"></div>
  <div class="field-group" style="margin-bottom:20px"><label class="field-label">Confirm password</label><input type="password" class="field" id="p2" placeholder="Repeat password"></div>
  <button class="btn btn-primary btn-full" onclick="doReset()">Update password →</button>
  <div style="text-align:center;margin-top:16px"><a href="login.html" style="font-size:13px;font-weight:700;color:var(--zk-fire)">← Back to sign in</a></div>
</div>
<script>
function doReset(){
  const p1=document.getElementById('p1').value;
  const p2=document.getElementById('p2').value;
  const ab=document.getElementById('alert-box');
  if(p1.length<8){ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">Password must be at least 8 characters.</div>';return;}
  if(p1!==p2){ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">Passwords do not match.</div>';return;}
  ab.innerHTML='<div class="alert alert-success" style="margin-bottom:14px">✅ Password updated. <a href="login.html" style="color:var(--zk-green);font-weight:700">Sign in now →</a></div>';
}
</script>
<script src="../assets/js/app.js"></script>
<script>
var API_BASE = ZK.api;
var TOKEN    = new URLSearchParams(window.location.search).get('token');

async function doResetPassword() {
  var pass  = (document.getElementById('password')  || {value:''}).value;
  var pass2 = (document.getElementById('password2') || {value:''}).value;
  if (!pass || pass.length < 8) { toast.error('Password must be at least 8 characters'); return; }
  if (pass !== pass2)            { toast.error('Passwords do not match'); return; }
  if (!TOKEN)                    { toast.error('Invalid reset link. Request a new one.'); return; }
  var btn = event.currentTarget;
  btnLoading(btn, true);
  try {
    var r = await fetch(API_BASE + '/auth/reset-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token: TOKEN, password: pass })
    });
    var d = await r.json();
    if (d.message) {
      toast.success('Password reset! Redirecting to login...');
      setTimeout(function(){ window.location.href = 'login.html'; }, 2000);
    } else {
      toast.error(d.error || 'Reset failed. Link may have expired.');
    }
  } catch(e) { toast.error('Server error'); }
  btnLoading(btn, false);
}
</script>
</body>
</html>
