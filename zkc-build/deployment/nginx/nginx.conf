# ZKCommerce v4.1 -- Nginx Configuration
# Production reverse proxy with SSL, gzip, security headers

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/xml application/json;

    # Rate limiting
    limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;

    # Security headers (applied globally)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API server: api.zkcommerce.in ───────────────────────
    server {
        listen 443 ssl http2;
        server_name api.zkcommerce.in;

        ssl_certificate     /etc/ssl/zkcommerce/fullchain.pem;
        ssl_certificate_key /etc/ssl/zkcommerce/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # Auth routes -- stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook -- no rate limit (Razorpay)
        location /api/payments/webhook {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Health check -- no auth needed
        location /health {
            proxy_pass http://localhost:3000;
            access_log off;
        }
    }

    # ── Frontend: zkcommerce.in ──────────────────────────────
    server {
        listen 443 ssl http2;
        server_name zkcommerce.in www.zkcommerce.in app.zkcommerce.in;

        ssl_certificate     /etc/ssl/zkcommerce/fullchain.pem;
        ssl_certificate_key /etc/ssl/zkcommerce/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root /var/www/zkcommerce;
        index auth/login.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Static assets -- long cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML pages -- no cache
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Default
        location / {
            try_files $uri $uri/ $uri.html /auth/login.html;
        }

        # Block access to sensitive files
        location ~ /\.(env|git|gitignore) {
            deny all;
            return 404;
        }
    }

    # ── HTTP -> HTTPS redirect ───────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
