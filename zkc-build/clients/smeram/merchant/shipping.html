<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping · ZKCommerce</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font:15px system-ui,sans-serif}header{background:#101a2c;color:white;padding:18px max(24px,calc((100% - 1120px)/2));display:flex;justify-content:space-between}header a{color:#b9d9ff;text-decoration:none}main{max-width:1120px;margin:30px auto;padding:0 20px}.toolbar,form{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:16px 0}.panel{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:18px;margin:16px 0}.panel h2{margin-top:0}input,select,button{font:inherit;padding:9px 11px;border:1px solid #d4dbe7;border-radius:8px;background:#fff}button{cursor:pointer}form label{display:grid;gap:5px;font-size:13px;color:#4b5563}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf0f5}td input,td select{max-width:150px}.muted{color:#6b7280}.error{color:#b42318}</style></head>
<body><header><strong>ZKCommerce · Shipping</strong><div style="display:flex;gap:12px;align-items:center"><a href="index.html" style="background:#1769d2;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:600">Unified Dashboard →</a><a href="../store-builder/">Back to Store Builder</a></div></header><main>
<div class="toolbar"><label>Store <select id="store"></select></label><button id="refresh">Refresh</button><span id="message" class="muted"></span></div>
<section class="panel"><h2>Shipping rates</h2><p class="muted">Set manual rates by postal-code prefix and free-shipping threshold. Courier booking and labels are not connected in this release.</p><form id="rateForm"><label>Name<input name="name" required placeholder="Standard delivery"></label><label>Amount (₹)<input name="rate" type="number" min="0" required value="0"></label><label>Free above (₹)<input name="free_above" type="number" min="0" placeholder="Optional"></label><label>Postal prefix<input name="postal_prefix" inputmode="numeric" placeholder="Optional"></label><label>Est. days<input name="estimated_days" placeholder="3–5 days"></label><label>Courier label<input name="courier" value="Manual fulfillment"></label><button type="submit">Add rate</button></form><div id="rates"></div></section>
<section class="panel"><h2>Fulfillment and tracking</h2><div id="shipments"></div></section><div id="error" class="error" role="alert"></div></main>
<script>
const token=localStorage.getItem('zk_token');let storeId='';const api='/api';
async function request(path,options={}){const headers={Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})};const response=await fetch(api+path,{...options,headers});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Request failed');return data}
function showError(text=''){document.getElementById('error').textContent=text}
async function init(){if(!token){location.href='../auth/login.html';return}try{const data=await request('/stores');const select=document.getElementById('store');select.replaceChildren(...(data.stores||[]).map(s=>new Option(s.store_name+' ('+s.slug+')',s.id)));storeId=select.value;if(!storeId){showError('Create a store first.');return}await load()}catch(e){showError(e.message)}}
async function load(){if(!storeId)return;showError();try{const [rates,shipments]=await Promise.all([request('/shipping/rates?store_id='+storeId),request('/shipping?store_id='+storeId)]);renderRates(rates.rates||[]);renderShipments(shipments.shipments||[])}catch(e){showError(e.message)}}
function renderRates(rows){const host=document.getElementById('rates');if(!rows.length){host.innerHTML='<p class="muted">No shipping rates configured.</p>';return}const table=document.createElement('table');table.innerHTML='<thead><tr><th>Name</th><th>Price</th><th>Free above</th><th>Postal prefix</th><th>Courier label</th><th>Active</th><th></th></tr></thead>';const body=document.createElement('tbody');rows.forEach(rate=>{const tr=document.createElement('tr');const vals=[rate.name,'₹'+rate.rate,rate.free_above==null?'—':'₹'+rate.free_above,rate.postal_prefix||'All',rate.courier,rate.active?'Yes':'No'];vals.forEach(value=>{const td=document.createElement('td');td.textContent=String(value);tr.append(td)});const action=document.createElement('td'),button=document.createElement('button');button.textContent='Delete';button.onclick=async()=>{if(confirm('Delete this rate?'))try{await request('/shipping/rates/'+rate.id+'?store_id='+storeId,{method:'DELETE'});load()}catch(e){showError(e.message)}};action.append(button);tr.append(action);body.append(tr)});table.append(body);host.replaceChildren(table)}
function renderShipments(rows){const host=document.getElementById('shipments');if(!rows.length){host.innerHTML='<p class="muted">No fulfillable orders yet.</p>';return}const table=document.createElement('table');table.innerHTML='<thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Courier</th><th>Tracking number</th><th>Update</th></tr></thead>';const body=document.createElement('tbody');rows.forEach(order=>{const tr=document.createElement('tr');const label=document.createElement('td');label.textContent=order.order_number;const customer=document.createElement('td');customer.textContent=order.customer_name||'';const statusCell=document.createElement('td'),status=document.createElement('select');['confirmed','processing','shipped','delivered','cancelled'].forEach(x=>status.add(new Option(x,x)));status.value=order.status;statusCell.append(status);const courierCell=document.createElement('td'),courier=document.createElement('input');courier.value=order.courier||'';courier.placeholder='Courier';courierCell.append(courier);const trackCell=document.createElement('td'),tracking=document.createElement('input');tracking.value=order.tracking_number||'';tracking.placeholder='Tracking number';trackCell.append(tracking);const action=document.createElement('td'),button=document.createElement('button');button.textContent='Save';button.onclick=async()=>{try{await request('/shipping/'+order.id,{method:'PUT',body:JSON.stringify({store_id:Number(storeId),status:status.value,courier:courier.value,tracking_number:tracking.value})});showError('Shipment updated.');load()}catch(e){showError(e.message)}};const invoice=document.createElement('button');invoice.textContent='Invoice PDF';invoice.style.marginLeft='6px';invoice.onclick=()=>downloadInvoice(order.id);action.append(button,invoice);tr.append(label,customer,statusCell,courierCell,trackCell,action);body.append(tr)});table.append(body);host.replaceChildren(table)}
async function downloadInvoice(orderId){try{const result=await request('/invoices/'+orderId,{method:'POST',body:JSON.stringify({store_id:Number(storeId)})});const response=await fetch(api+'/invoices/'+result.invoice.id+'/pdf?store_id='+storeId,{headers:{Authorization:'Bearer '+token}});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||'Invoice PDF could not be generated')}const url=URL.createObjectURL(await response.blob()),a=document.createElement('a');a.href=url;a.download=result.invoice.invoice_number+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){showError(e.message)}}
document.getElementById('store').addEventListener('change',e=>{storeId=e.target.value;load()});document.getElementById('refresh').onclick=load;document.getElementById('rateForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries(f);body.store_id=Number(storeId);body.rate=Number(body.rate);body.free_above=body.free_above===''?null:Number(body.free_above);try{await request('/shipping/rates',{method:'POST',body:JSON.stringify(body)});e.target.reset();e.target.elements.courier.value='Manual fulfillment';await load()}catch(error){showError(error.message)}};init();
</script></body></html>
