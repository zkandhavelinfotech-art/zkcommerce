<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — ZKCommerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
<style>
body{min-height:100vh;background:var(--g-hero);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.auth-logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:800;margin-bottom:32px;justify-content:center}
.auth-gem{width:40px;height:40px;border-radius:10px;background:var(--g-fire);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 16px rgba(255,107,0,.4)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--zk-dim);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--zk-border)}
</style>
<div class="auth-card">
  <div class="auth-logo"><div class="auth-gem">⚡</div>ZKCommerce</div>
  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:800;margin-bottom:6px;text-align:center">Welcome back</h2>
  <p style="font-size:13px;color:var(--zk-muted);text-align:center;margin-bottom:28px">Sign in to your merchant dashboard</p>
  <div id="alert-box"></div>
  <div class="field-group" style="margin-bottom:14px">
    <label class="field-label">Email address</label>
    <input type="email" class="field" id="email" placeholder="merchant@example.in" autocomplete="email">
  </div>
  <div class="field-group" style="margin-bottom:6px">
    <label class="field-label">Password</label>
    <input type="password" class="field" id="password" placeholder="Your password" autocomplete="current-password">
  </div>
  <div style="text-align:right;margin-bottom:20px">
    <a href="forgot-password.html" style="font-size:12px;font-weight:700;color:var(--zk-fire)">Forgot password?</a>
  </div>
  <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Sign in →</button>
  <div class="divider">or</div>
  <div style="text-align:center;font-size:13px;color:var(--zk-muted)">
    New to ZKCommerce? <a href="register.html" style="font-weight:700;color:var(--zk-fire)">Create free account</a>
  </div>
  <div style="margin-top:24px;padding:14px;background:var(--zk-chalk);border-radius:10px">
    <div style="font-size:11px;font-weight:700;color:var(--zk-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.07em">Demo accounts</div>
    <div style="font-size:12px;color:var(--zk-muted);display:flex;flex-direction:column;gap:4px">
      <span>🏪 <strong>merchant@zkcommerce.in</strong> / demo1234</span>
      <span>👤 <strong>customer@zkcommerce.in</strong> / demo1234</span>
      <span>🔧 <strong>admin@zkcommerce.in</strong> / admin1234</span>
    </div>
  </div>
</div>
<script>
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  const btn=document.getElementById('login-btn');
  const ab=document.getElementById('alert-box');
  if(!email||!pass){ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">Please enter email and password.</div>';return;}
  btnLoading(btn,true);
  try{
    const res=await api.post('/auth/login',{email,password:pass});
    if(res.token){
      auth.save(res.token,res.user);
      const role=res.user.role;
      if(role==='merchant'){
      const setup=localStorage.getItem('zk_setup_complete');
      window.location.href=setup?'../merchant/dashboard.html':'../merchant/setup.html';
    }
      else if(role==='admin')window.location.href='../admin/dashboard.html';
      else window.location.href='../storefront/home.html';
    }else{
      ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">'+(res.message||'Invalid credentials')+'</div>';
      btnLoading(btn,false);
    }
  }catch(e){
    // Demo mode fallback
    const demos={
      'merchant@zkcommerce.in':'demo1234',
      'customer@zkcommerce.in':'demo1234',
      'admin@zkcommerce.in':'admin1234',
    };
    const roles={'merchant@zkcommerce.in':'merchant','customer@zkcommerce.in':'customer','admin@zkcommerce.in':'admin'};
    if(demos[email]===pass){
      auth.save('demo_token_'+Date.now(),{id:1,name:'Demo User',email,role:roles[email]||'merchant'});
      const role=roles[email]||'merchant';
      if(role==='merchant'){
      const setup=localStorage.getItem('zk_setup_complete');
      window.location.href=setup?'../merchant/dashboard.html':'../merchant/setup.html';
    }
      else if(role==='admin')window.location.href='../admin/dashboard.html';
      else window.location.href='../storefront/home.html';
    }else{
      ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">Invalid email or password. Try the demo accounts below.</div>';
      btnLoading(btn,false);
    }
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
<script src="../../assets/js/app.js"></script>
</body>
</html>
