<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account — ZKCommerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
<style>
body{min-height:100vh;background:var(--g-hero);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:460px;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.auth-gem{width:40px;height:40px;border-radius:10px;background:var(--g-fire);display:flex;align-items:center;justify-content:center;font-size:20px}
</style>
<div class="auth-card">
  <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:800;margin-bottom:28px;justify-content:center">
    <div class="auth-gem">⚡</div>ZKCommerce
  </div>
  <h2 style="font-family:var(--font-display);font-size:22px;font-weight:800;margin-bottom:4px;text-align:center">Start selling free</h2>
  <p style="font-size:13px;color:var(--zk-muted);text-align:center;margin-bottom:24px">30-day free trial · No credit card · 0% transaction fees</p>
  <div id="alert-box"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
    <div class="field-group"><label class="field-label">First name</label><input type="text" class="field" id="fname" placeholder="Rajan"></div>
    <div class="field-group"><label class="field-label">Last name</label><input type="text" class="field" id="lname" placeholder="Kumar"></div>
  </div>
  <div class="field-group" style="margin-bottom:12px"><label class="field-label">Email address *</label><input type="email" class="field" id="email" placeholder="rajan@mystore.in"></div>
  <div class="field-group" style="margin-bottom:12px"><label class="field-label">WhatsApp number *</label><input type="tel" class="field" id="phone" placeholder="98765 43210"></div>
  <div class="field-group" style="margin-bottom:12px"><label class="field-label">Store name *</label><input type="text" class="field" id="store" placeholder="Rajan Textiles"></div>
  <div class="field-group" style="margin-bottom:12px"><label class="field-label">Password *</label><input type="password" class="field" id="password" placeholder="Min 8 characters"></div>
  <div style="padding:12px;background:var(--zk-pale);border-radius:10px;font-size:12px;color:var(--zk-muted);margin-bottom:16px;display:flex;align-items:flex-start;gap:8px">
    <span>🔒</span><span>By creating an account you agree to our <a href="#" style="color:var(--zk-fire);font-weight:700">Terms of Service</a> and <a href="#" style="color:var(--zk-fire);font-weight:700">Privacy Policy</a>.</span>
  </div>
  <button class="btn btn-primary btn-full" onclick="doRegister()">Create free account →</button>
  <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--zk-muted)">
    Already have an account? <a href="login.html" style="font-weight:700;color:var(--zk-fire)">Sign in</a>
  </div>
</div>
<script>
async function doRegister(){
  const btn=event.currentTarget;
  const ab=document.getElementById('alert-box');
  const data={
    firstName:document.getElementById('fname').value.trim(),
    lastName:document.getElementById('lname').value.trim(),
    email:document.getElementById('email').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    storeName:document.getElementById('store').value.trim(),
    password:document.getElementById('password').value,
  };
  if(!data.email||!data.password||!data.storeName){
    ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">Please fill in all required fields.</div>';return;
  }
  if(data.password.length<8){
    ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">Password must be at least 8 characters.</div>';return;
  }
  btnLoading(btn,true);
  try{
    const res=await api.post('/auth/register',data);
    if(res.token){auth.save(res.token,res.user);window.location.href='../merchant/setup.html';}
    else{ab.innerHTML='<div class="alert alert-error" style="margin-bottom:14px">'+(res.message||'Registration failed')+'</div>';btnLoading(btn,false);}
  }catch(e){
    // Demo mode
    auth.save('demo_'+Date.now(),{id:Date.now(),name:data.firstName+' '+data.lastName,email:data.email,role:'merchant',storeName:data.storeName});
    window.location.href='../merchant/setup.html';
  }
}
</script>
<script src="../../assets/js/app.js"></script>
</body>
</html>
