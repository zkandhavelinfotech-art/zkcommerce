        </div>

        <button class="btn btn-secondary btn-sm" onclick="toast.success('Coupon SAVE10 applied! ₹1,690 off')">Apply</button>

<footer style="background:var(--zk-deep);padding:40px 5% 24px;margin-top:60px">
  <div style="max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:7px;background:var(--g-fire);display:flex;align-items:center;justify-content:center;font-size:13px">⚡</div>

    </div>
    <div style="font-size:12px;color:rgba(255,255,255,.3)">Powered by <a href="../../index.html" style="color:rgba(255,107,0,.7);font-weight:700">ZKCommerce</a> · 🇮🇳 Made in Tamil Nadu</div>
    <div style="font-size:12px;color:rgba(255,255,255,.3)">© 2026 Rajan Textiles. All rights reserved.</div>
  </div>
</footer><script src="../assets/js/app.js"></script>
<script>
var API_BASE = window.location.protocol==='file:' ? 'http://localhost:3000/api' : (window.ZK?ZK.api:'/api');

function renderCart() {
  var items = cart.items;
  var tbody = document.getElementById('cart-tbody');
  var emptyEl = document.getElementById('cart-empty');
  var summaryEl = document.getElementById('cart-summary');

  if (!items.length) {
    if (tbody) tbody.innerHTML = '';
    if (emptyEl) emptyEl.style.display = 'block';
    if (summaryEl) summaryEl.style.display = 'none';
    return;
  }
  if (emptyEl) emptyEl.style.display = 'none';
  if (summaryEl) summaryEl.style.display = 'block';

  var subtotal = 0;
  if (tbody) {
    tbody.innerHTML = items.map(function(item) {
      var lineTotal = item.price * item.quantity;
      subtotal += lineTotal;
      return '<tr>'
        + '<td><div style="display:flex;align-items:center;gap:10px">'
        + '<div style="width:48px;height:48px;background:var(--zk-chalk);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px">&#128722;</div>'
        + '<div><div style="font-weight:700">' + item.name + '</div></div></div></td>'
        + '<td>' + fmt.inr(item.price) + '</td>'
        + '<td><div style="display:flex;align-items:center;gap:8px">'
        + '<button onclick="changeQty(' + item.id + ',-1)" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--zk-border);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">-</button>'
        + '<span style="font-weight:700;min-width:20px;text-align:center">' + item.quantity + '</span>'
        + '<button onclick="changeQty(' + item.id + ',1)"  style="width:28px;height:28px;border-radius:6px;border:1px solid var(--zk-border);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">+</button>'
        + '</div></td>'
        + '<td style="font-weight:700">' + fmt.inr(lineTotal) + '</td>'
        + '<td><button onclick="removeItem(' + item.id + ')" style="color:#DC2626;background:none;border:none;cursor:pointer;font-size:18px">&#10005;</button></td>'
        + '</tr>';
    }).join('');
  }

  var shipping = subtotal >= 999 ? 0 : 99;
  var total = subtotal + shipping;

  setEl('subtotal',  fmt.inr(subtotal));
  setEl('shipping',  shipping === 0 ? 'Free' : fmt.inr(shipping));
  setEl('total',     fmt.inr(total));
  setEl('cart-count-label', items.length + ' item' + (items.length !== 1 ? 's' : ''));
}

function setEl(id, val) { var el=document.getElementById(id); if(el) el.textContent=val; }

function changeQty(id, delta) {
  var items = cart.items;
  var item = items.find(function(i){ return i.id===id; });
  if (!item) return;
  var newQty = item.quantity + delta;
  if (newQty <= 0) { cart.remove(id); }
  else { cart.update(id, newQty); }
  renderCart();
}

function removeItem(id) {
  cart.remove(id);
  toast.info('Item removed');
  renderCart();
}

async function applyCoupon() {
  var code = document.getElementById('coupon-code');
  if (!code || !code.value.trim()) { toast.error('Enter a coupon code'); return; }
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('store') || 'rajanTextiles';
  try {
    var r = await fetch(API_BASE + '/coupons/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code.value.trim(), store_id: 1, subtotal: cart.total })
    });
    var data = await r.json();
    if (data.valid) {
      toast.success('Coupon applied! Saving ' + fmt.inr(data.discount));
      localStorage.setItem('zk_coupon', JSON.stringify({ code: code.value.trim(), discount: data.discount }));
    } else {
      toast.error(data.error || 'Invalid coupon');
    }
  } catch(e) { toast.error('Could not validate coupon'); }
}

function goCheckout() {
  if (!cart.items.length) { toast.error('Your cart is empty'); return; }
  var params = new URLSearchParams(window.location.search);
  var store = params.get('store') || '';
  window.location.href = 'checkout.html' + (store ? '?store=' + store : '');
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>
