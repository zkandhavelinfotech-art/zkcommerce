<script>
var API_BASE = ZK.api;
async function loadTracking() {
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('id') || params.get('order');
  if (!orderId) return;
  var token = auth.token;
  if (!token || token.startsWith('demo_token')) return;
  try {
    var r = await fetch(API_BASE + '/orders/' + orderId, { headers: { 'Authorization': 'Bearer ' + token }});
    var d = await r.json();
    if (!d.order) return;
    var o = d.order;
    setEl('track-order-id', fmt.orderId(o.id));
    setEl('track-status',   o.status);
    setEl('track-total',    fmt.inr(o.total));
    setEl('track-date',     fmt.date(o.created_at));
    if (o.awb_number) {
      setEl('track-awb',    o.awb_number);
      setEl('track-courier', o.courier || 'Delhivery');
      var trackBtn = document.getElementById('track-awb-btn');
      if (trackBtn) trackBtn.href = 'https://www.delhivery.com/track/package/' + o.awb_number;
    }
    var statuses = ['pending','processing','shipped','delivered'];
    var currentIdx = statuses.indexOf(o.status);
    statuses.forEach(function(s, i) {
      var el = document.getElementById('step-' + s);
      if (el) {
        el.style.color = i <= currentIdx ? 'var(--zk-fire)' : 'var(--zk-muted)';
        el.style.fontWeight = i === currentIdx ? '800' : '400';
      }
    });
  } catch(e) {}
}
function setEl(id, val) { var el=document.getElementById(id); if(el) el.textContent=val; }
document.addEventListener('DOMContentLoaded', loadTracking);
</script>
