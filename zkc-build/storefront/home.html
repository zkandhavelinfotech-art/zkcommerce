<script>
var API_BASE = window.location.protocol==='file:' ? 'http://localhost:3000/api' : (window.ZK?ZK.api:'/api');

async function loadStorefront() {
  // Get store slug from URL param or ZK_STORE injected by Cloudflare worker
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('store') || (window.ZK_STORE ? window.ZK_STORE.slug : null) || 'rajanTextiles';

  try {
    // Load store info
    var sr = await fetch(API_BASE + '/storefront/' + slug);
    var sd = await sr.json();
    if (sd.store) {
      var store = sd.store;
      document.querySelectorAll('.store-name').forEach(function(el){ el.textContent = store.name; });
      document.title = store.name + ' — ZKCommerce';
      if (store.primary_color) {
        document.documentElement.style.setProperty('--zk-fire', store.primary_color);
      }
      var logoEl = document.getElementById('store-logo');
      if (logoEl && store.logo_url) logoEl.src = store.logo_url;
    }

    // Load products
    var pr = await fetch(API_BASE + '/storefront/' + slug + '/products?limit=8&sort=newest');
    var pd = await pr.json();
    var grid = document.getElementById('featured-products-grid');
    if (grid && pd.products && pd.products.length) {
      grid.innerHTML = pd.products.map(function(p) {
        var discount = p.mrp ? Math.round((p.mrp - p.price) / p.mrp * 100) : 0;
        return '<div class="zk-product-card" onclick="window.location.href=\'product.html?id=' + p.id + '&store=' + slug + '\'">'
          + '<div class="zk-product-img" style="background:linear-gradient(135deg,#FFF7F0,#FFE4CC);height:200px;display:flex;align-items:center;justify-content:center;font-size:44px">'
          + (p.image_url ? '<img src="' + p.image_url + '" style="width:100%;height:100%;object-fit:cover">' : '&#128722;')
          + (discount > 0 ? '<span class="zk-product-badge" style="position:absolute;top:8px;left:8px">' + discount + '% off</span>' : '')
          + '</div>'
          + '<div class="zk-product-info">'
          + '<div class="zk-product-name">' + p.name + '</div>'
          + '<div class="zk-product-price">' + fmt.inr(p.price) + (p.mrp ? '<span class="original">' + fmt.inr(p.mrp) + '</span>' : '') + '</div>'
          + '<button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;font-size:12px" onclick="event.stopPropagation();cart.add({id:' + p.id + ',name:\'' + p.name.replace(/'/g,"\\'") + '\',price:' + p.price + '});toast.success(\'Added to cart!\')">Add to cart</button>'
          + '</div></div>';
      }).join('');
    }

    // Load categories
    var cr = await fetch(API_BASE + '/categories?slug=' + slug);
    var cd = await cr.json();
    var catGrid = document.getElementById('categories-grid');
    if (catGrid && cd.categories && cd.categories.length) {
      catGrid.innerHTML = cd.categories.map(function(c) {
        return '<div onclick="window.location.href=\'category.html?cat=' + c.slug + '&store=' + slug + '\'" style="cursor:pointer;background:#fff;border:1px solid var(--zk-border);border-radius:14px;padding:20px;text-align:center;transition:all .15s" onmouseover="this.style.borderColor=\'var(--zk-fire)\'" onmouseout="this.style.borderColor=\'var(--zk-border)\'">'
          + '<div style="font-size:32px;margin-bottom:8px">' + (c.icon || '&#128722;') + '</div>'
          + '<div style="font-size:13px;font-weight:700">' + c.name + '</div>'
          + '</div>';
      }).join('');
    }
  } catch(e) { console.warn('Storefront load error:', e); }
}

document.addEventListener('DOMContentLoaded', loadStorefront);
</script>
